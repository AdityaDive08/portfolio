<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Background squircle card ensuring visibility on both dark and light browser tabs -->
  <rect width="60" height="60" x="2" y="2" rx="15" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <text x="31" y="44" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="900" letter-spacing="-1.5" text-anchor="middle">
    <tspan fill="#0f172a">A</tspan><tspan fill="#1558C9">D</tspan><tspan fill="#1558C9">.</tspan>
  </text>
</svg>
